<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shopkart Seller Portal | Store Management OS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏪</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #060b18; color: #f8fafc; font-family: 'Inter', sans-serif; }
    .custom-card { background-color: #0c1427; border: 1px solid #1a2949; }
    .auth-input { background-color: #090e1a; border: 1px solid #222e47; color: #ffffff; border-radius: 0.6rem; padding: 0.75rem 0.9rem; font-size: 0.875rem; width: 100%; outline: none; }
    .auth-input:focus { border-color: #6366f1; }
    .auth-btn-primary { background-color: #4f46e5; color: #ffffff; font-weight: 700; border-radius: 0.6rem; padding: 0.8rem; width: 100%; transition: background-color 0.2s; }
    .auth-btn-primary:hover { background-color: #4338ca; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-14 select-none">
  <!-- SELLER AUTH MODAL -->
  <div id="auth-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="custom-card p-6 max-w-sm w-full space-y-4 rounded-2xl border border-[#23314d]">
      <div class="text-center space-y-1">
        <h2 class="text-2xl font-extrabold text-indigo-400 font-serif">Shopkart Seller Portal</h2>
        <p class="text-xs text-slate-400">Create your separate Customer Store Link (7 Days Free)</p>
      </div>
      <div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-[#0a0f1d] border border-[#23314d]">
        <button id="tab-login" onclick="switchAuthView('STORE_LOGIN')" class="py-2 rounded-lg text-xs font-bold transition bg-indigo-600 text-white">Store Login</button>
        <button id="tab-reg" onclick="switchAuthView('STORE_REG')" class="py-2 rounded-lg text-xs font-bold transition text-slate-400">Register Store</button>
      </div>
      <div id="form-store-login" class="space-y-3 pt-1">
        <input type="email" id="store-login-email" placeholder="Registered Store Email *" class="auth-input">
        <input type="password" id="store-login-pass" placeholder="Store Password *" class="auth-input">
        <button onclick="submitStoreLogin()" class="auth-btn-primary mt-2">Log In to Seller Dashboard</button>
      </div>
      <div id="form-store-reg" class="space-y-2.5 pt-1 hidden">
        <input type="text" id="store-reg-name" required placeholder="1. Shop / Brand Name *" class="auth-input">
        <input type="tel" id="store-reg-phone" maxlength="10" required placeholder="2. WhatsApp Mobile Number (10 Digits) *" class="auth-input">
        <input type="email" id="store-reg-email" required placeholder="3. Store Owner Email ID *" class="auth-input">
        <input type="password" id="store-reg-pass" required placeholder="4. Create Store Password *" class="auth-input">
        <button onclick="submitStoreRegister()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs mt-2 shadow-lg">Register Store (7 Days Free)</button>
      </div>
      <p id="auth-error-msg" class="text-rose-400 text-xs font-medium text-center min-h-[16px]"></p>
    </div>
  </div>

  <!-- SELLER WORKSPACE -->
  <div id="app-seller-page" class="hidden flex-1 flex flex-col">
    <header class="custom-card sticky top-0 z-30 px-4 py-2.5 flex items-center justify-between border-b border-[#1a2949]">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white text-xs">🏪</div>
        <div>
          <h1 class="font-bold text-sm text-white" id="seller-header-store-name">My Store</h1>
          <span class="text-[10px] text-indigo-400 font-bold">Shopkart Seller OS</span>
        </div>
      </div>
      <button onclick="doLogout()" class="h-8 px-3 rounded-xl bg-rose-600/20 text-rose-400 text-xs font-bold hover:bg-rose-600 hover:text-white transition">Log Out</button>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto p-4 space-y-4">
      <div class="custom-card rounded-3xl p-6 space-y-4 border-2 border-indigo-500/30 bg-[#0c1427]">
        <div>
          <span class="text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400">SEPARATE CUSTOMER WEB PAGE</span>
          <h2 class="text-lg font-bold mt-1 text-white">Aapki Dukaan Ka Alag Customer Web Link</h2>
          <p class="text-xs text-slate-400 mt-0.5">Is link ko apne customers ko bhejein. Customer ko sirf aapke products aur WhatsApp order button dikhenge.</p>
        </div>
        <div class="p-4 rounded-2xl border font-mono text-xs sm:text-sm font-bold break-all bg-[#080e1e] border-[#222e47]">
          <span id="sellerCustomerLinkBox" class="text-indigo-400">https://...</span>
        </div>
        <div class="flex gap-2">
          <button onclick="copyMyCustomerStoreLink()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md">📋 Copy Customer Web Link</button>
          <button onclick="openMyCustomerStorePreview()" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md">👁️ Open Store Page</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://rcofrtcyhjgdsiotkkjq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6uFSLPyZ6w-VXAhkXgL5uA_cvFJO73C";
    const client = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    function getCustomerPageUrl(slug) {
      const baseDir = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      return `${baseDir}store.html?store=${slug}`;
    }

    window.loggedInStore = null;

    window.switchAuthView = function(view) {
      document.getElementById("auth-error-msg").innerText = "";
      if (view === "STORE_REG") {
        document.getElementById("form-store-reg").classList.remove("hidden");
        document.getElementById("form-store-login").classList.add("hidden");
        document.getElementById("tab-reg").className = "py-2 rounded-lg text-xs font-bold transition bg-emerald-600 text-white shadow";
        document.getElementById("tab-login").className = "py-2 rounded-lg text-xs font-bold transition text-slate-400";
      } else {
        document.getElementById("form-store-login").classList.remove("hidden");
        document.getElementById("form-store-reg").classList.add("hidden");
        document.getElementById("tab-login").className = "py-2 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow";
        document.getElementById("tab-reg").className = "py-2 rounded-lg text-xs font-bold transition text-slate-400";
      }
    };

    window.submitStoreRegister = async function() {
      const name = document.getElementById("store-reg-name").value.trim();
      const phone = document.getElementById("store-reg-phone").value.trim();
      const email = document.getElementById("store-reg-email").value.trim().toLowerCase();
      const pass = document.getElementById("store-reg-pass").value.trim();
      const err = document.getElementById("auth-error-msg");
      err.innerText = "";

      if (!name || !phone || !email || !pass) { err.innerText = "⚠️ Saare 4 options (Name, Mobile, Email, Password) mandatory hain!"; return; }

      const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Math.floor(100 + Math.random() * 900);
      const exp = new Date(); exp.setDate(exp.getDate() + 7);

      const payload = {
        store_name: name, store_slug: slug, owner_email: email, owner_phone: phone,
        whatsapp_number: "91" + phone, password: pass, expires_at: exp.toISOString(), status: "ACTIVE"
      };

      const { data, error } = await client.from("shopkart_stores").insert([payload]).select().single();
      if (error && !data) { err.innerText = "Error: " + error.message; return; }

      const created = data || { id: "store-" + Date.now(), ...payload };
      window.loggedInStore = created;
      localStorage.setItem("shopkart_isolated_session", JSON.stringify(created));
      document.getElementById("auth-modal").classList.add("hidden");
      bootPortal();
    };

    window.submitStoreLogin = async function() {
      const email = document.getElementById("store-login-email").value.trim().toLowerCase();
      const pass = document.getElementById("store-login-pass").value;
      const err = document.getElementById("auth-error-msg");
      err.innerText = "";

      if (!email || !pass) { err.innerText = "Email aur Password dono enter karein!"; return; }

      const { data, error } = await client.from("shopkart_stores").select("*").eq("owner_email", email).maybeSingle();
      if (error || !data || data.password !== pass) { err.innerText = "Galat Email ya Password!"; return; }

      window.loggedInStore = data;
      localStorage.setItem("shopkart_isolated_session", JSON.stringify(data));
      document.getElementById("auth-modal").classList.add("hidden");
      bootPortal();
    };

    function bootPortal() {
      const st = window.loggedInStore;
      if (!st) return;
      document.getElementById("seller-header-store-name").innerText = st.store_name;
      document.getElementById("sellerCustomerLinkBox").innerText = getCustomerPageUrl(st.store_slug);
      document.getElementById("app-seller-page").classList.remove("hidden");
    }

    window.copyMyCustomerStoreLink = function() {
      navigator.clipboard.writeText(document.getElementById("sellerCustomerLinkBox").innerText);
      alert("✅ Customer Store Link Copy Ho Gaya!");
    };
    window.openMyCustomerStorePreview = function() { window.open(document.getElementById("sellerCustomerLinkBox").innerText, "_blank"); };
    window.doLogout = function() { localStorage.removeItem("shopkart_isolated_session"); location.reload(); };

    window.onload = function() {
      const saved = localStorage.getItem("shopkart_isolated_session");
      if (saved) { window.loggedInStore = JSON.parse(saved); bootPortal(); return; }
      document.getElementById("auth-modal").classList.remove("hidden");
      switchAuthView("STORE_REG");
    };
  </script>
</body>
</html>
